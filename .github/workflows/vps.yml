name: VPS RustDesk & Termux SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Injection de la clé SSH de votre Termux
      - name: Configurer la clé SSH Termux
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      # 2. Connexion à votre réseau Tailscale (supporte SSH et RustDesk)
      - name: Connexion Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      # 3. Installation de l'interface graphique et de RustDesk
      - name: Installer l'environnement graphique et RustDesk
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xvfb wget
          
          # Téléchargement et installation de RustDesk
          wget https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb -O rustdesk.deb
          sudo apt-get install -y ./rustdesk.deb || sudo apt-get install -f -y
          
          # Définition du mot de passe RustDesk
          sudo rustdesk --password MonMotDePasse123
          
          # Lancement de l'affichage virtuel et de RustDesk
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x720x24 &
          sleep 2
          dbus-launch startxfce4 &
          sudo rustdesk --service &
          sleep 5

      # 4. Affichage de l'ID RustDesk dans les logs
      - name: Afficher l'ID RustDesk
        run: |
          echo "=================================================="
          echo "VOTRE ID RUSTDESK :"
          rustdesk --get-id
          echo "MOT DE PASSE RUSTDESK : MonMotDePasse123"
          echo "=================================================="

      - name: Maintenir la session active
        run: sleep 21600
