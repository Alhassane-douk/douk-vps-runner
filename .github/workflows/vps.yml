name: VPS Desktop Web (noVNC) & SSH Termux
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Clé SSH Termux
      - name: Configurer la clé SSH Termux
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      # 2. Connexion Tailscale
      - name: Connexion Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      # 3. Installation de XFCE, VNC et noVNC
      - name: Installer Bureau Graphique & noVNC
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver novnc websockify net-tools
          
          # Configuration du mot de passe VNC (vncroot)
          mkdir -p ~/.vnc
          echo "vncroot" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Script de démarrage XFCE pour VNC
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

          # Lancer le serveur VNC sur le port :1 (5901)
          vncserver :1 -geometry 1280x720 -depth 24

          # Lancer noVNC Web Client sur le port 6080
          websockify --web=/usr/share/novnc/ 6080 localhost:5901 &
          sleep 3

      # 4. Affichage du lien d'accès
      - name: Afficher les adresses d'accès
        run: |
          IP=$(tailscale ip -4)
          echo "=================================================="
          echo "ACCÈS ACCÈS BUREAU WEB (noVNC) :"
          echo "http://$IP:6080/vnc.html"
          echo ""
          echo "MOT DE PASSE VNC : vncroot"
          echo "IP TAILSCALE : $IP"
          echo "=================================================="

      - name: Maintenir la session active
        run: sleep 21600
