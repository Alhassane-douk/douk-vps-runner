name: VPS RustDesk & Termux SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configuration de la clé SSH Termux
      - name: Configurer la clé SSH Termux
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      # 2. Connexion Tailscale
      - name: Connexion Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      # 3. Installation de l'environnement graphique et RustDesk
      - name: Installer XFCE et RustDesk
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xvfb wget dbus-x11
          
          # Téléchargement et installation de RustDesk
          wget https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb -O rustdesk.deb
          sudo apt-get install -y ./rustdesk.deb || sudo apt-get install -f -y
          
          # Démarrer le service RustDesk
          sudo systemctl enable --now rustdesk || sudo rustdesk --service &
          sleep 5
          
          # Définir le mot de passe
          sudo rustdesk --password MonMotDePasse123

      # 4. Lancement de la session graphique en arrière-plan
      - name: Démarrer le bureau virtuel
        run: |
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x720x24 &
          sleep 3
          dbus-launch startxfce4 &
          sleep 3

      # 5. Affichage des informations de connexion
      - name: Afficher les accès RustDesk
        run: |
          echo "=================================================="
          echo "IP TAILSCALE DU RUNNER :"
          tailscale ip -4
          echo "ID RUSTDESK :"
          rustdesk --get-id || echo "Consultez l'IP Tailscale"
          echo "MOT DE PASSE : MonMotDePasse123"
          echo "=================================================="

      - name: Maintenir la session active
        run: sleep 21600
