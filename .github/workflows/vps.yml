name: VPS RustDesk & Termux SSH
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Clé SSH Termux
      - name: Configurer la clé SSH Termux
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      # 2. Connexion Tailscale
      - name: Connexion Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      # 3. Installation et configuration forcée de RustDesk
      - name: Installer et configurer RustDesk
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xvfb wget dbus-x11
          
          # Téléchargement et installation de RustDesk
          wget https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb -O rustdesk.deb
          sudo apt-get install -y ./rustdesk.deb || sudo apt-get install -f -y

          # Arrêt du service pour appliquer les modifications
          sudo systemctl stop rustdesk || pkill rustdesk || true

          # Configuration forcée du mot de passe (MdpRustdesk2026)
          sudo rustdesk --password MdpRustdesk2026
          
          # Démarrer l'affichage virtuel
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x720x24 &
          sleep 3
          dbus-launch startxfce4 &
          sleep 3

          # Démarrer le service RustDesk
          sudo rustdesk --service &
          sleep 5

      # 4. Affichage des identifiants exacts
      - name: Afficher les accès RustDesk
        run: |
          echo "=================================================="
          echo "IP TAILSCALE :"
          tailscale ip -4
          echo "ID RUSTDESK :"
          rustdesk --get-id
          echo "MOT DE PASSE CONFIGURÉ : MdpRustdesk2026"
          echo "=================================================="

      - name: Maintenir la session active
        run: sleep 21600
