name: FRP Server on Tailscale VM

on:
  workflow_dispatch: # Permet de lancer le runner manuellement depuis GitHub

jobs:
  run-frps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-vm-runner

      - name: Télécharger et installer FRP
        run: |
          FRP_VERSION="0.58.1" # Vérifiez la dernière version stable
          curl -LO https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_linux_amd64.tar.gz
          tar -xzf frp_${FRP_VERSION}_linux_amd64.tar.gz
          mv frp_${FRP_VERSION}_linux_amd64/frps ./frps
          chmod +x ./frps

      - name: Démarrer le serveur FRPS
        run: |
          echo "Lancement de frps..."
          ./frps -c frps.toml
